name: PAICOT Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed Release APK (requires signing secrets)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.11 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Python unit tests (paicot library)
        run: python3 -m unittest discover -s tests/python -v

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAICOT-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.build_release == true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.11 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Normalize line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Check signing secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Missing KEYSTORE_PASSWORD secret"
            exit 1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::Missing KEY_ALIAS secret"
            exit 1
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Missing KEY_PASSWORD secret"
            exit 1
          fi

      - name: Write keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAICOT-Android-APK-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
